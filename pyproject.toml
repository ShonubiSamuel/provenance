[project]
name = "github-code-explorer"
version = "0.1.0"
description = "A local research index over GitHub code — filters, history, and 'first appeared' sorting GitHub Code Search can't do."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",   # GitHub App JWT signing
    "python-dateutil>=2.9",
    "aria2p>=0.12",         # controls the aria2c download daemon over JSON-RPC
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
history-precise = [
    "pygit2>=1.14",         # clone-precise asset-history tier (optional)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
